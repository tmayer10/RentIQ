services:
  # PostgreSQL Database
  db:
    image: postgres:14-alpine
    env_file: .env
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # Django Backend
  backend:
    build: ./backend
    command: >
      sh -c "
        python manage.py migrate &&
        python manage.py runserver 0.0.0.0:8000
      "
    volumes:
      - ./backend:/app
      - ./EDA:/data/EDA
      - ./chat_utils:/app/chat_utils
    ports:
      - "8000:8000"
    environment:
      - DATABASE_HOST=db
      - DATABASE_NAME=rentiq_db
      - DATABASE_USER=rentiq_user
      - DATABASE_PASSWORD=RentIQ2025!
      - REDIS_URL=${REDIS_URL}
      - PYTHONPATH=/app/chat_utils:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    stdin_open: true
    tty: true

  streamlit:
    image: rentiq-backend:latest     # reuse backend image after build
    build: ./backend                 # ensures Streamlit and deps are installed
    command: >
      sh -c "streamlit run /app/chat_utils/chat_app.py --server.address=0.0.0.0 --server.port=8501"
    volumes:
      - ./backend:/app
      - ./chat_utils:/app/chat_utils
    environment:
      - DATABASE_HOST=db
      - DATABASE_NAME=rentiq_db
      - DATABASE_USER=rentiq_user
      - DATABASE_PASSWORD=RentIQ2025!
      - REDIS_URL=redis://redis:6379/0
      - PYTHONPATH=/app/chat_utils:/app
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - HF_TOKEN=${HF_TOKEN}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - PINECONE_API_KEY=${PINECONE_API_KEY}
      - PINECONE_INDEX_NAME=${PINECONE_INDEX_NAME}
    ports:
      - "8501:8501"
    depends_on:
      - backend
      - redis

volumes:
  postgres_data:
# RentIQ Supervisor Configuration
# Manages Django (Gunicorn) and Streamlit as supervised processes
#
# Install location: /etc/supervisor/conf.d/rentiq.conf
# After editing, run: sudo supervisorctl reread && sudo supervisorctl update

[group:rentiq]
programs=django_gunicorn,streamlit_app
priority=999

# ============================================================================
# Django/Gunicorn Backend
# ============================================================================
[program:django_gunicorn]
command=/home/ubuntu/RentIQ/venv/bin/gunicorn \
    --config /home/ubuntu/RentIQ/deployment/gunicorn.conf.py \
    --bind 127.0.0.1:8000 \
    --workers 4 \
    --threads 2 \
    --timeout 120 \
    --worker-class sync \
    --worker-tmp-dir /dev/shm \
    --access-logfile /var/log/rentiq/gunicorn_access.log \
    --error-logfile /var/log/rentiq/gunicorn_error.log \
    --log-level info \
    backend.wsgi:application

directory=/home/ubuntu/RentIQ
user=ubuntu
group=ubuntu
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true

# Environment variables (load from .env file)
environment=PATH="/home/ubuntu/RentIQ/venv/bin",
    DJANGO_SETTINGS_MODULE="backend.settings",
    PYTHONPATH="/home/ubuntu/RentIQ"

# Logging
stdout_logfile=/var/log/rentiq/django_supervisor_stdout.log
stderr_logfile=/var/log/rentiq/django_supervisor_stderr.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=10

# Restart policy
startretries=3
startsecs=10
stopwaitsecs=30

# Priority (lower number = higher priority)
priority=10

# ============================================================================
# Streamlit Chat Interface
# ============================================================================
[program:streamlit_app]
command=/home/ubuntu/RentIQ/venv/bin/streamlit run \
    /home/ubuntu/RentIQ/streamlit_app/app.py \
    --server.port 8501 \
    --server.address 0.0.0.0 \
    --server.headless true \
    --server.enableCORS false \
    --server.enableXsrfProtection true \
    --browser.gatherUsageStats false \
    --logger.level info

directory=/home/ubuntu/RentIQ/streamlit_app
user=ubuntu
group=ubuntu
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true

# Environment variables
environment=PATH="/home/ubuntu/RentIQ/venv/bin",
    PYTHONPATH="/home/ubuntu/RentIQ"

# Logging
stdout_logfile=/var/log/rentiq/streamlit_supervisor_stdout.log
stderr_logfile=/var/log/rentiq/streamlit_supervisor_stderr.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=10

# Restart policy
startretries=3
startsecs=10
stopwaitsecs=30

# Priority
priority=20

# ============================================================================
# Supervisor Event Listeners (Optional - for monitoring)
# ============================================================================
[eventlistener:process_monitor]
command=/home/ubuntu/RentIQ/venv/bin/python /home/ubuntu/RentIQ/deployment/scripts/supervisor_monitor.py
events=PROCESS_STATE_EXITED,PROCESS_STATE_FATAL
buffer_size=100
stdout_logfile=/var/log/rentiq/supervisor_monitor.log
stderr_logfile=/var/log/rentiq/supervisor_monitor_error.log
autostart=false  # Enable if you create the monitor script
autorestart=true
